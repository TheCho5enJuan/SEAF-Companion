plugins { id 'com.android.application' }
android {
    namespace 'com.seaf.companion'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.seaf.companion'
        minSdk 26
        targetSdk 35
        versionCode (System.getenv('SEAF_VERSION_CODE') ?: '1').toInteger()
        versionName '1.0'
    }
}
